name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Mondays at 04:23 UTC: the full checks over every pack (see the packs
    # job), and every job on the runners' newest images.
    - cron: '23 4 * * 1'
  workflow_dispatch:  # by hand: also the full checks over every pack

permissions:
  contents: read

concurrency:
  # By event too, so that a push to main doesn't cancel the weekly run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings every dev build must be free of (docs/PLAN.md section 8).
  WFLAGS: -Wall -Wextra -Wpedantic -Werror -Wshadow -Wstrict-prototypes -Wmissing-prototypes

jobs:
  packs:
    # Picks the packs that Linux, Alpine and macOS check in full, with lc
    # check's slow checks on the full-size cases: brute's time against the
    # limit, slow.c, and ref with the sanitizers (docs/PLAN.md section
    # 6.4). Over every pack those would take hours, so they run on the
    # packs a push or PR changes, and on every pack when lc's runtime
    # changes, weekly, and when the workflow is run by hand. Every job
    # checks every pack without them (lc check --quick, in make test).
    name: Packs to check in full
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.which.outputs.all }}
      packs: ${{ steps.which.outputs.packs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the history, to compare with the base
      - name: Find them
        id: which
        shell: bash  # adds -o pipefail, so a failing full-packs.sh fails the step
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The commit to compare with; none means every pack.
          base=
          case $EVENT in
          pull_request)
            # What the PR changes: the first parent of the merge commit
            # that is checked out is the PR's base.
            base=HEAD^1 ;;
          push)
            # What the push changes. On main, that is what the merged PRs
            # change: their own runs checked those packs, but against the
            # base they had, so this also covers two PRs merged one after
            # the other (a runtime change, then a pack). Checking every
            # pack on each merge would take hours for packs nothing
            # touched; the weekly run covers the rest. After a force-push
            # the old commit is gone: on a branch, compare with where it
            # leaves main, as for a new branch; on main, check every pack.
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base=$BEFORE
            elif [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD) || base=
            fi ;;
          esac
          echo "Comparing with: ${base:-nothing}"
          packs=$(sh tools/full-packs.sh "$base" | xargs)
          if [ "$packs" = all ]; then
            echo "Checking every pack in full"
            echo "all=true" >>"$GITHUB_OUTPUT"
            echo "packs=" >>"$GITHUB_OUTPUT"
          else
            echo "Checking in full: ${packs:-no pack}"
            echo "all=false" >>"$GITHUB_OUTPUT"
            echo "packs=$packs" >>"$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux (${{ matrix.cc }})
    needs: packs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5
      - name: Show compiler
        run: $CC --version
      - name: Build and test
        run: make CC="$CC" CFLAGS="-O2 $WFLAGS" test
      - name: Check ${{ needs.packs.outputs.all == 'true' && 'every pack' || 'the changed packs' }} in full
        # What the next step checks, and the slow checks on the full-size
        # cases (see the packs job).
        if: needs.packs.outputs.all == 'true' || needs.packs.outputs.packs != ''
        env:
          PACKS: ${{ needs.packs.outputs.packs }}
        run: make CC="$CC" CFLAGS="-O2 $WFLAGS" check-packs PACKS="$PACKS"
      - name: Check every pack (--quick)
        # Every pack: its stubs build, ref passes every case, full-size
        # ones included, and ref and brute agree on 300 random cases (make
        # test uses fewer). Not the slow checks on the full-size cases.
        if: needs.packs.outputs.all != 'true'
        run: make CC="$CC" CFLAGS="-O2 $WFLAGS" check-packs CHECKFLAGS=--quick
      - name: Incremental rebuilds
        run: |
          # test_fs.c and test_md.c #include core sources, so their objects
          # must be rebuilt when one of those changes.
          check_dep() {  # check_dep OBJECT SOURCE...
            obj=$1; shift
            for src in "$@"; do
              make CC="$CC" CFLAGS="-O2 $WFLAGS" "$obj"
              touch "$src"
              st=0; make -q "$obj" || st=$?
              if [ "$st" -ne 1 ]; then
                echo "$obj is not rebuilt when $src changes" >&2
                exit 1
              fi
            done
          }
          check_dep tests/unit/test_fs.o src/core/arena.c src/core/str.c src/core/ctx.c src/core/fs.c
          check_dep tests/unit/test_md.o src/core/arena.c src/core/str.c src/core/md.c
          # PREFIX is compiled into problem.o and test_problem.o: changing it
          # must rebuild both, or test_problem fails.
          make CC="$CC" CFLAGS="-O2 $WFLAGS" PREFIX=/opt/pkg test

  sanitizers:
    name: Linux (gcc, ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      # ASan can crash at startup with the high mmap randomization that
      # recent Ubuntu kernels use; lower it to the value ASan supports.
      - name: Lower mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Build and test
        run: >-
          make CC=gcc
          CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -Wall -Wextra -Werror'
          LDFLAGS='-fsanitize=address,undefined'
          test

  bmake:
    # Proves the Makefile is portable POSIX make, not GNU make only.
    name: Linux (bmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bmake
        run: sudo apt-get update && sudo apt-get install -y bmake
      - name: Build and test
        run: bmake CFLAGS="-O2 $WFLAGS" test
      - name: Change PREFIX right after a build
        # bmake compares mtimes to the second, so .datadir is usually
        # rewritten in the same second as the last build. lc must still get
        # the new DATADIR compiled in.
        run: |
          bmake PREFIX="$RUNNER_TEMP/inst" install
          (unset LC_PROBLEMS XDG_DATA_HOME; HOME=/nonexistent "$RUNNER_TEMP/inst/bin/lc" list) |
            grep 'Two Sum'
          check_lc() {  # check_lc NEW OLD: lc has PREFIX=NEW compiled in, not OLD
            grep -q -F "$1/share/lcclone/problems" lc || {
              echo "lc does not have PREFIX=$1 compiled in" >&2; exit 1; }
            if grep -q -F "$2/share/lcclone" lc; then
              echo "lc still has the old PREFIX=$2 compiled in" >&2; exit 1
            fi
          }
          bmake PREFIX=/opt/a && bmake PREFIX=/opt/b
          check_lc /opt/b /opt/a
          # The same, deterministically: make every output newer than the
          # .datadir that is about to be written.
          touch -t 203001010000 src/core/*.o src/cli/*.o liblc.a lc
          bmake PREFIX=/opt/c
          check_lc /opt/c /opt/b
          bmake PREFIX=/opt/pkg test

  alpine:
    name: Alpine (musl)
    needs: packs
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install build tools
        run: apk add --no-cache build-base
      - uses: actions/checkout@v5
      - name: Build and test
        run: make CFLAGS="-O2 $WFLAGS" test
      - name: Check ${{ needs.packs.outputs.all == 'true' && 'every pack' || 'the changed packs' }} in full
        # As on the other systems, so that a slow.c that musl or its gcc
        # lets pass is noticed. musl's gcc has no sanitizers: lc check
        # notes that it leaves that check out.
        if: needs.packs.outputs.all == 'true' || needs.packs.outputs.packs != ''
        env:
          PACKS: ${{ needs.packs.outputs.packs }}
        run: make CFLAGS="-O2 $WFLAGS" check-packs PACKS="$PACKS"

  macos:
    name: macOS (clang)
    needs: packs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show compiler
        run: clang --version
      - name: Build and test
        run: make CC=clang CFLAGS="-O2 $WFLAGS" test
      - name: Check ${{ needs.packs.outputs.all == 'true' && 'every pack' || 'the changed packs' }} in full
        if: needs.packs.outputs.all == 'true' || needs.packs.outputs.packs != ''
        env:
          PACKS: ${{ needs.packs.outputs.packs }}
        run: make CC=clang CFLAGS="-O2 $WFLAGS" check-packs PACKS="$PACKS"
      - name: Check every pack (--quick)
        if: needs.packs.outputs.all != 'true'
        run: make CC=clang CFLAGS="-O2 $WFLAGS" check-packs CHECKFLAGS=--quick

  install:
    # Installs, then runs lc with no LC_PROBLEMS and an empty HOME, so the
    # only packs it can find are the ones in the compiled-in data directory.
    name: Install smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # adds -o pipefail, so a failing lc fails the step
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: make PREFIX="$RUNNER_TEMP/inst" install
      - name: Check the installed files
        run: |
          test -x "$RUNNER_TEMP/inst/bin/lc"
          test -f "$RUNNER_TEMP/inst/share/lcclone/problems/0001-two-sum/problem.md"
      - name: Run the installed lc
        run: |
          unset LC_PROBLEMS XDG_DATA_HOME
          HOME=$(mktemp -d "$RUNNER_TEMP/home.XXXXXX")
          export HOME
          cd "$HOME"
          lc="$RUNNER_TEMP/inst/bin/lc"
          "$lc" version
          "$lc" list
          "$lc" list | grep 'Two Sum'
          "$lc" show 1
          "$lc" show 1 | grep 'Two Sum'
          "$lc" list --json | grep '"two-sum"'
          "$lc" show 104 --json | grep '"maximum-depth-of-binary-tree"'
          # Solve a problem with the installed lc: the harness runtime is
          # built into lc, and the packs' reference solutions are installed.
          "$lc" start 1 --lang c --no-edit
          cp "$RUNNER_TEMP/inst/share/lcclone/problems/0001-two-sum/ref.c" \
            "$HOME/lc/0001-two-sum/solution.c"
          "$lc" submit 1
          (cd "$HOME/lc/0001-two-sum" && "$lc" test)
      - name: Staged install with DESTDIR
        run: |
          # PREFIX is compiled into lc. No "make clean" here: changing PREFIX
          # must rebuild what depends on it by itself.
          make PREFIX=/usr DESTDIR="$RUNNER_TEMP/stage" install
          lc="$RUNNER_TEMP/stage/usr/bin/lc"
          test -x "$lc"
          test -f "$RUNNER_TEMP/stage/usr/share/lcclone/problems/0104-maximum-depth-of-binary-tree/tests.txt"
          # The staged lc must search /usr/share/lcclone, not the old PREFIX.
          grep -q -F /usr/share/lcclone "$lc"
          if grep -q -F "$RUNNER_TEMP/inst" "$lc"; then
            echo "staged lc still has the old PREFIX compiled in" >&2
            exit 1
          fi
      - name: Install from a checkout made with umask 077
        run: |
          # What install creates must be usable by everyone, whatever the
          # umask of the checkout and of the installer (sudo keeps the
          # user's umask).
          umask 077
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/u077"
          cd "$RUNNER_TEMP/u077"
          make PREFIX="$RUNNER_TEMP/inst077" install
          bad=`find "$RUNNER_TEMP/inst077" \( -type d ! -perm -0555 \) -o \( -type f ! -perm -0444 \)`
          if [ -n "$bad" ]; then
            printf 'not readable by everyone:\n%s\n' "$bad" >&2
            exit 1
          fi
